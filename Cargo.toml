[package]
name = "yummy_egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Backend-independent egui widgets, lists and TOML themes"
repository = "https://github.com/gloridifice/yummy-egui"
documentation = "https://docs.rs/yummy_egui"
readme = "README.md"
keywords = ["egui", "gui", "widgets", "theme", "ui"]
categories = ["gui"]
license = "MIT"
publish = ["crates-io"]
include = ["/src/**", "/examples/**", "/readme/**", "/README.md", "/PUBLISHING.md", "/LICENSE*", "/Cargo.toml", "/Cargo.lock"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
dock = ["dep:egui_dock"]

[dependencies]
egui = { version = "0.33.3", default-features = false, features = ["serde"] }
egui_dock = { version = "0.18.0", optional = true, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"

[dev-dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.33.3", features = ["default_fonts"] }
